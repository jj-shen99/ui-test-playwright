name: PR Smoke Tests

on:
  pull_request:
    branches: [main]

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  smoke-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: grafana_test
          POSTGRES_PASSWORD: grafana_test
          POSTGRES_DB: grafana_ui_testing
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U grafana_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run DB migration
        run: npx tsx db/migrate.ts
        env:
          DATABASE_URL: postgresql://grafana_test:grafana_test@localhost:5432/grafana_ui_testing

      - name: Start deterministic environment
        run: |
          docker compose -f env/docker-compose.yml up -d victoriametrics grafana
          npx tsx scripts/wait-for-services.ts

      - name: Seed test data
        run: npx tsx tests/fixtures/seed.ts

      - name: Run smoke tests
        run: npx playwright test --grep @smoke --reporter=json,html
        env:
          GRAFANA_URL: http://localhost:3000
          VM_URL: http://localhost:8428
          STORE_RESULTS: "true"
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
          TRIGGER_SOURCE: pr
          GRAFANA_VERSION: "11.4.0"
          DATABASE_URL: postgresql://grafana_test:grafana_test@localhost:5432/grafana_ui_testing

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Tear down environment
        if: always()
        run: docker compose -f env/docker-compose.yml down -v
